# Generated by Shikshya: CI for an Express + Prisma + React app
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
env:
  NODE_VERSION: "20"
jobs:
  backend:
    name: Backend typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
        env:
          JWT_SECRET: ci-secret-with-at-least-sixteen-chars
          TEST_DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      - run: npm run build
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --legacy-peer-deps
      - run: npm run build
  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t app:ci .
