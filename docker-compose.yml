# Ports taken on this machine: POSTGRES_PORT=5434 APP_PORT=8010 docker compose up.
# The database listens on localhost only; the app reaches it over the compose network.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app}@db:5432/app
      JWT_SECRET: shikshya-dev-secret-change-in-production
      NODE_ENV: production
      SERVE_FRONTEND: "1"
      SEED_DEMO: "0"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata: {}
